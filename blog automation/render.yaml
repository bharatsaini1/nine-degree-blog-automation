services:
  # -------------------------------------------------------------
  # 1. FRONTEND: Nine Degree Editorial OS Dashboard (React + Vite)
  # -------------------------------------------------------------
  - type: static
    name: nine-degree-dashboard
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # -------------------------------------------------------------
  # 2. BACKEND: n8n Multi-Agent Automation Engine (Docker)
  # -------------------------------------------------------------
  - type: web
    name: nine-degree-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: N8N_PROTOCOL
        value: https
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

# -------------------------------------------------------------
# 3. DATABASE: Persistent PostgreSQL Storage for n8n
# -------------------------------------------------------------
databases:
  - name: n8n-db
    plan: free
